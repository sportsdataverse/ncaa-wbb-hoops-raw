name: tests

# Offline capture-stack suite. This repo had NO CI at all (2026-08-02 pipeline
# audit): the WBB scrapers were verified only when a human remembered to run
# pytest locally, against a sibling sdv-py checkout.
#
# Runnable here at all only since the HTML fixtures were copied in-repo
# (tests/fixtures/) -- they previously lived in a sibling ../../sdv-py
# checkout, a path no runner has.
#
# Sparse-checkout on purpose: the committed `wbb/` tree never lands on a
# runner; the tests never read it. canary_vendors.toml.example IS read
# (test_ncaa_canary). Tests that would need the archive tree carry the
# `archive` marker and are deselected here.

on:
  push:
    branches: [main]
    paths: ['python/**', 'tests/**', 'scripts/**', 'pyproject.toml', 'uv.lock', '.github/workflows/tests.yml']
  pull_request:
    paths: ['python/**', 'tests/**', 'scripts/**', 'pyproject.toml', 'uv.lock', '.github/workflows/tests.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            python
            tests
            scripts
            canary_vendors.toml.example
            pyproject.toml
            uv.lock
          sparse-checkout-cone-mode: false

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
          cache-dependency-glob: uv.lock

      # --frozen: the lockfile is the contract. sportsdataverse is a git source
      # pinned in uv.lock, so a green run proves the launchers work against the
      # sdv-py revision this repo actually claims -- not whatever main happens
      # to resolve to at run time. Bump deliberately with `uv lock`.
      - name: Sync the locked project environment
        run: uv sync --frozen

      - name: Lint (pinned ruff rule set)
        run: uv run --no-sync ruff check python/ tests/

      - name: Shell syntax check
        run: bash -n scripts/*.sh

      - name: Run the capture-stack suite
        run: uv run --no-sync pytest -q -m "not archive"
